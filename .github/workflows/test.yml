name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (sem dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/run.js backend

  frontend:
    name: Frontend (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.js frontend
