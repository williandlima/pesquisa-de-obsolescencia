[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Fixa a versão do Node do deploy — sem isso, o runtime é o default do
  # Netlify no momento do build, que pode mudar sem aviso e quebrar `fetch`
  # nativo/AbortController se algum dia regredir para <18.
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Redireciona /api/check-part para a função serverless
[[redirects]]
  from = "/api/check-part"
  to = "/.netlify/functions/check-part"
  status = 200
